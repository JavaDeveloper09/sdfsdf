<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri - Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2416501088.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> |
            <a href="etkinlikler.html">Etkinlikler</a> |
            <a href="etkinlik-detay.html">Detay</a> |
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>
        <section class="form-kutusu">
            <h2>Yeni Etkinlik Ekle</h2>
            <form id="etkinlik-formu">
                <div class="form-grup">
                    <label for="baslik">Etkinlik Adı:</label>
                    <input type="text" id="baslik" name="baslik" placeholder="Örn: Yapay Zeka Semineri" required>
                </div>

                <div class="form-grup">
                    <label for="kategori">Kategori:</label>
                    <select id="kategori" name="kategori">
                        <option value="Seminer">Seminer</option>
                        <option value="Atölye">Atölye</option>
                        <option value="Söyleşi">Söyleşi</option>
                        <option value="Konser">Konser</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="tarih">Tarih:</label>
                    <input type="date" id="tarih" name="tarih" required>
                </div>

                <div class="form-grup">
                    <label for="saat">Saat:</label>
                    <input type="time" id="saat" name="saat" required>
                </div>

                <div class="form-grup">
                    <label for="yer">Yer / Salon:</label>
                    <input type="text" id="yer" name="yer" placeholder="Örn: A Blok Konferans Salonu" required>
                </div>

                <div class="form-grup">
                    <label for="kontenjan">Kontenjan:</label>
                    <input type="number" id="kontenjan" name="kontenjan" placeholder="Örn: 50">
                </div>

                <div class="form-grup">
                    <label for="aciklama">Açıklama:</label>
                    <textarea id="aciklama" name="aciklama" rows="4" placeholder="Etkinlik hakkında kısa bilgi..."></textarea>
                </div>

                <button type="submit" class="btn-kaydet">Etkinliği Kaydet</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kampüs Etkinlikleri</p>
    </footer>
</body>
</html>
